<p class="calibre"><br class="calibre1"/></p>
<p class="calibre">　――つまるところ。生まれたことに<ruby><rb>意味</rb><rt>りゆう</rt></ruby>など無く。</p>
<p class="calibre">　――死ぬことにも<ruby><rb>理由</rb><rt>いみ</rt></ruby>は無く。</p>
<p class="calibre">　――その道程すらも世界にとっては無意味そのもので。</p>
<p class="calibre">　――世界が欲するのは、そのちっぽけな選択だけなのだろう。</p>
